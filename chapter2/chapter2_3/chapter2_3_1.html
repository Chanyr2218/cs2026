            } else if (subnum === 3) {

            }

            }
        }

        // 초기화 버튼을 누르면 리셋과 함께 테두리를 지운다.
        function reset_quiz() {
            for (let i = 1; i <= total_questions; i++) {
                document.quizform['quiz' + i].style.border = "";
            }
        }

        // 답변이 맞으면 테두리를 초록색, 틀리면 붉은색으로 변경한다.
        function correct_answer(a){
            document.quizform['quiz' + a].style.border = "2px solid green";
        }
        function wrong_answer(a){
            document.quizform['quiz' + a].style.border = "2px solid red";
        }    
    </script>
